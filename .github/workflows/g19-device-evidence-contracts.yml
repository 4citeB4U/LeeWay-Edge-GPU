name: G18 G19 Device Evidence Contract Regression

on:
  pull_request:
    paths:
      - 'contracts/**'
      - 'core/governed-software-compute.mjs'
      - 'core/canonical-provider-readiness.mjs'
      - 'core/canonical-formula-software-observation.mjs'
      - 'fallback/**'
      - 'dispatch/tensor-contract.mjs'
      - 'tests/virtual-gpu/**'
      - 'scripts/run-g26-formula-observation.mjs'
      - '.github/workflows/g19-device-evidence-contracts.yml'
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'core/governed-software-compute.mjs'
      - 'core/canonical-provider-readiness.mjs'
      - 'core/canonical-formula-software-observation.mjs'
      - 'fallback/**'
      - 'dispatch/tensor-contract.mjs'
      - 'tests/virtual-gpu/**'
      - 'scripts/run-g26-formula-observation.mjs'
      - '.github/workflows/g19-device-evidence-contracts.yml'

permissions:
  contents: read

jobs:
  device-evidence-contracts:
    name: G19 Device Evidence Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Hydrate only the package manifest from Git LFS
        run: |
          git lfs pull --include="package.json" --exclude=""
          node -e "const p=require('./package.json'); if(p.name!=='leeway-edge-gpu') process.exit(1)"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run source-only fail-closed contract regressions
        run: node --test contracts/*.test.mjs
      - name: Run G22 G23 G24 software-only pipeline regressions
        run: |
          node --test \
            tests/virtual-gpu/software-cpu-host.test.mjs \
            tests/virtual-gpu/software-square-locality.test.mjs \
            tests/virtual-gpu/governed-software-compute.test.mjs \
            tests/virtual-gpu/canonical-provider-readiness.test.mjs \
            tests/virtual-gpu/canonical-formula-software-observation.test.mjs
